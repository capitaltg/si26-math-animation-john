# Devcontainer-only overrides layered on top of docker-compose.yml +
# docker-compose.dev.yml. When compose is invoked with multiple `-f` files,
# relative paths in EVERY file resolve against the FIRST file's project
# directory — not the file that literally contains the path. Here that
# project directory is the repository root, so `.` == repo root.
#
# Adds one mount: the whole repo at /workspace so .vscode/tasks.json, the
# Makefile, README, and docs/ are visible inside the container, alongside
# the /app/backend subtree that Dockerfile.backend already copies in.
#
# Does NOT override `working_dir`. The image's WORKDIR is /app/backend
# because docker-entrypoint.sh runs `alembic upgrade head` from there
# (alembic.ini is at /app/backend/alembic.ini). VS Code's `workspaceFolder`
# in devcontainer.json controls where the editor and integrated terminal
# open — it is independent of the container's WORKDIR.

services:
  backend:
    volumes:
      - .:/workspace:cached
