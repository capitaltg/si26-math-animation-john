name: Backend tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # Manim render tests shell out to ffmpeg, link against cairo/pango,
      # and (via `manim.NumberLine(include_numbers=True)` inside the
      # `number_line` template scenes -- see
      # `app/templates/number_line/scene.py` and
      # `app/meta/manim_primitives/visuals.py`) render tick numbers with
      # `DecimalNumber -> MathTex -> latex -> dvisvgm`, so the texlive
      # stack has to be present. The v3 `_number_line_labels` path uses
      # Pango-based `manim.Text`, but the manim primitive one does not.
      #
      # `cache-apt-pkgs-action` tarballs the installed files after the
      # first successful run and restores them in seconds on subsequent
      # runs, so this step goes from ~30 minutes of `apt-get install` to
      # under a minute once the cache is warm. Bump `version` to force
      # a rebuild if the package list changes.
      - name: Install system deps for Manim rendering
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            ffmpeg libcairo2-dev libpango1.0-dev pkg-config
            libblas3 liblapack3
            texlive texlive-latex-extra texlive-fonts-extra
            texlive-latex-recommended texlive-science tipa dvisvgm
          version: 3

      # A restored cache copies the package files back but never runs
      # dpkg's configure step, so LaTeX's `ls-R` filename databases and its
      # preloaded format files are absent -- `latex` is on PATH and then
      # fails with "latex error converting to dvi" on the first render. The
      # cold run that populates the cache configures normally and passes,
      # which is why this surfaced as a CI failure that only reproduced once
      # the cache was warm (5m21s green on the cache miss, 3m red on the hit).
      - name: Rebuild LaTeX databases after cache restore
        run: |
          sudo dpkg --configure -a || true
          sudo texhash
          sudo fmtutil-sys --all

      - name: Install backend and dev deps
        run: pip install -e ".[dev]"

      # Runs the same set of checks a deployment healthcheck would run:
      # every runtime binary (ffmpeg / latex / dvisvgm) on PATH, a Text-only
      # Manim render end-to-end, Bedrock config schema, writable storage,
      # feature-flag values printed for the deploy log. Fails fast so a
      # system-dep drift surfaces here with a diagnostic instead of later
      # as a mysterious per-test error.
      - name: Preflight
        run: python -m scripts.preflight

      # No AWS creds: every Bedrock call is mocked and integration tests are skip-marked.
      - name: Run tests
        run: pytest -q
