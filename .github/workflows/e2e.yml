name: E2E smoke

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'eval/fixtures/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'eval/fixtures/**'
      - '.github/workflows/e2e.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Manim is a hard runtime dep of the backend, so `pip install -e .`
      # builds pycairo, which needs the cairo/pango headers on the system.
      # Skipping the LaTeX/ffmpeg pieces of the backend workflow keeps this
      # job fast — Phase A never renders.
      - name: Install cairo + pango headers for pycairo build
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libcairo2-dev libpango1.0-dev pkg-config
          version: 1

      - name: Install backend into venv the playwright config expects
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke
        working-directory: frontend
        env:
          CI: '1'
        run: npm run e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
