# Public demo stack. Bring up: `docker compose up --build -d`.
# Front door: http://localhost (or map 80 to your public LB).
#
# Secrets: copy `.env.docker.example` to `.env` in this directory and fill in
# real values. `.env` is gitignored.

services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks: [app]

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://demo:${POSTGRES_PASSWORD}@postgres:5432/demo
      REDIS_URL: redis://redis:6379/0
      # Session state must fit in one process — see backend/app/session.py header.
      WEB_CONCURRENCY: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_media:/app/backend/media
      - backend_var:/app/backend/var
    expose:
      - "8000"
    restart: unless-stopped
    networks: [app]

  # Only started when META_CODEGEN_ENABLED=true (bring up with
  # `docker compose --profile meta up -d`). Otherwise the worker self-exits
  # in a tight loop, which is harmless but noisy.
  meta-worker:
    profiles: ["meta"]
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["python", "-m", "scripts.meta_worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://demo:${POSTGRES_PASSWORD}@postgres:5432/demo
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - backend_media:/app/backend/media
      - backend_var:/app/backend/var
    restart: unless-stopped
    networks: [app]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: demo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "demo", "-d", "demo"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [app]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [app]

volumes:
  postgres_data:
  backend_media:
  backend_var:

networks:
  app:
    driver: bridge
