worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 50m;   # .pptx uploads

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # L1 rate limits — per client IP, two zones.
    # Cheap endpoints share a generous zone; Bedrock-heavy endpoints share a
    # tighter one so scrapers hit the wall before spending our AWS budget.
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_bedrock:10m rate=2r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=api_conn:10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;

        # Static SPA.
        root /usr/share/nginx/html;
        index index.html;

        # Bedrock-touching endpoints — strict L1.
        location ~ ^/(upload|options|storyboard|meta)(/|$) {
            limit_req zone=api_bedrock burst=5 nodelay;
            limit_conn api_conn 8;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Render / media / thumbnails / clips — cheaper zone, longer timeout for renders.
        location ~ ^/(render|clips|thumbnails)(/|$) {
            limit_req zone=api_general burst=50 nodelay;
            limit_conn api_conn 16;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # SPA fallback.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
