worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 50m;   # .pptx uploads

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # --- Trusted-proxy handling ---------------------------------------------
    # By default this nginx is the trusted edge, so `$remote_addr` == the real
    # client IP. When you put a load balancer / TLS terminator (Caddy, Traefik,
    # AWS ALB, Cloudflare, …) in front, uncomment ONE of the blocks below —
    # otherwise `$remote_addr` becomes the LB and every user shares one
    # rate-limit quota, and the per-IP Bedrock cap in the backend collapses.
    #
    # Example: single trusted LB on the same VPC subnet
    #   set_real_ip_from 10.0.0.0/8;
    #   real_ip_header X-Forwarded-For;
    #   real_ip_recursive on;
    #
    # Example: Cloudflare in front
    #   include /etc/nginx/cloudflare-ips.conf;   # `set_real_ip_from` per range
    #   real_ip_header CF-Connecting-IP;
    # ------------------------------------------------------------------------

    # L1 rate limits — per client IP, two zones.
    # Cheap endpoints share a generous zone; Bedrock-heavy endpoints share a
    # tighter one so scrapers hit the wall before spending our AWS budget.
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_bedrock:10m rate=2r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=api_conn:10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    upstream backend {
        server backend:8000;
    }

    # Common proxy headers. `X-Forwarded-For` is set from `$remote_addr` (NOT
    # `$proxy_add_x_forwarded_for`) so a client-supplied `X-Forwarded-For`
    # cannot poison the backend's per-IP Bedrock quota — the trusted edge
    # authoritatively replaces the header.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 80;
        server_name _;

        # Static SPA.
        root /usr/share/nginx/html;
        index index.html;

        # Bedrock-touching endpoints — strict L1.
        location ~ ^/(upload|options|storyboard|meta)(/|$) {
            limit_req zone=api_bedrock burst=5 nodelay;
            limit_conn api_conn 8;
            proxy_pass http://backend;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Render / media / thumbnails / clips — cheaper zone, longer timeout for renders.
        location ~ ^/(render|clips|thumbnails)(/|$) {
            limit_req zone=api_general burst=50 nodelay;
            limit_conn api_conn 16;
            proxy_pass http://backend;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # SPA fallback.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
