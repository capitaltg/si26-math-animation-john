# Mounted into nginx only when running the TLS overlay
# (`docker-compose.tls.yml`), where Caddy fronts nginx on the internal `app`
# network. Docker's default bridge networks assign 172.16.0.0/12; we trust
# that whole range because it is unreachable from the internet — only the
# Caddy container can present an XFF nginx will honor.
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
